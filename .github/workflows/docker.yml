name: Docker image

# main 分支推送：构建并推送 <版本> 与 latest
# v* 标签：额外推送同名标签
# PR：只构建验证，不推送
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/zyallday/snell-server
  PLATFORMS: linux/amd64,linux/arm64,linux/386

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # 版本号以 Dockerfile 中的 ARG SNELL_VERSION 为准，升级时只改一处。
      - name: Read Snell version
        id: ver
        run: |
          v="$(sed -nE 's/^ARG SNELL_VERSION=([0-9.]+)$/\1/p' Dockerfile | head -n1)"
          [ -n "$v" ] || { echo "SNELL_VERSION not found in Dockerfile" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # 推送前先在 amd64 上实际启动镜像，覆盖自带二进制、下载新版本、校验失败回退三种情况。
      - name: Build test image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: SNELL_VERSION=${{ steps.ver.outputs.version }}
          load: true
          tags: snell-test
          cache-from: type=gha

      - name: Smoke test
        env:
          BIN_URL: https://dl.nssurge.com/snell/snell-server-v${{ steps.ver.outputs.version }}-linux-{arch}.zip
        run: |
          set -eu
          # 失败时把每个容器的状态和日志写成 error 注解，在 Summary 页不展开日志也能看到。
          report() {
            rc=$?
            [ "$rc" = 0 ] && return
            for c in bundled download badsum; do
              docker inspect "$c" >/dev/null 2>&1 || continue
              st="$(docker inspect -f 'running={{.State.Running}} exit={{.State.ExitCode}} health={{if .State.Health}}{{.State.Health.Status}}{{end}}' "$c")"
              logs="$(docker logs "$c" 2>&1 | tail -n 25 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"
              echo "::error title=smoke ${c} (${st})::${logs:-<no output>}"
            done
          }
          trap report EXIT
          sha="$(sed -nE 's/^ARG SHA256_AMD64=([0-9a-f]{64})$/\1/p' Dockerfile)"
          start() {
            local name="$1"; shift
            docker run -d --name "$name" --read-only \
              --tmpfs /var/lib/snell:exec,size=64m,mode=0755 \
              --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add SETUID --cap-add SETGID \
              --security-opt no-new-privileges:true "$@" snell-test >/dev/null
          }
          start bundled
          start download -e SNELL_BIN_URL="$BIN_URL" -e SNELL_BIN_SHA256="$sha"
          start badsum   -e SNELL_BIN_URL="$BIN_URL" -e SNELL_BIN_SHA256="$(printf '0%.0s' {1..64})"

          for c in bundled download badsum; do
            for i in $(seq 1 30); do
              s="$(docker inspect -f '{{.State.Health.Status}}' "$c")"
              [ "$s" = healthy ] && break
              [ "$(docker inspect -f '{{.State.Running}}' "$c")" = true ] || break
              sleep 5
            done
            echo "::group::$c logs ($s)"; docker logs "$c" 2>&1; echo "::endgroup::"
            [ "$s" = healthy ] || { echo "$c is not healthy" >&2; exit 1; }
          done

          docker logs download 2>&1 | grep -q "Using downloaded /var/lib/snell/snell-server"
          docker logs badsum   2>&1 | grep -q "SHA256 mismatch"
          docker logs badsum   2>&1 | grep -q "falling back to bundled"
          docker exec download cat /proc/1/cmdline | tr '\0' ' ' | grep -q '^/var/lib/snell/snell-server '
          echo "All smoke tests passed."

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=ref,event=pr
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          build-args: SNELL_VERSION=${{ steps.ver.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
