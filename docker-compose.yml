services:
  snell:
    build:
      context: .
      args:
        SNELL_VERSION: ${SNELL_VERSION:-6.0.0}
      # 本机 `docker compose build` 只构建当前架构；多架构见 Makefile 的 buildx 目标。
    image: ${SNELL_IMAGE:-snell-server}:${SNELL_VERSION:-6.0.0}
    container_name: snell-server
    restart: unless-stopped

    # 配置目录：放入 snell-server.conf 则直接使用；不存在时按下方环境变量生成并保存在这里。
    volumes:
      - ./config:/etc/snell
    # SNELL_BIN_URL 下载的二进制放在这里（根文件系统只读）；必须带 exec，否则无法运行。
    tmpfs:
      - /var/lib/snell:exec,size=64m,mode=0755

    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      SNELL_LOG_LEVEL: ${SNELL_LOG_LEVEL:-notify}
      # 设置后每次启动先下载该版本再运行，失败则回退到镜像自带版本；{arch} 会替换为 amd64/aarch64/i386
      SNELL_BIN_URL: ${SNELL_BIN_URL:-}
      SNELL_BIN_SHA256: ${SNELL_BIN_SHA256:-}   # 可选，强烈建议设置
      # ---- 以下仅在配置文件不存在时生效 ----
      SNELL_PSK: ${SNELL_PSK:-}                 # 留空则生成随机 PSK，写入配置文件
      SNELL_PORT: ${SNELL_PORT:-7177}
      SNELL_LISTEN: ${SNELL_LISTEN:-}           # 设置后覆盖 SNELL_PORT，如 0.0.0.0:7177,[::]:7177
      SNELL_MODE: ${SNELL_MODE:-default}        # default | unshaped | unsafe-raw
      SNELL_DNS: ${SNELL_DNS:-}                 # 如 1.1.1.1,8.8.8.8
      SNELL_DNS_IP_PREFERENCE: ${SNELL_DNS_IP_PREFERENCE:-default}
      SNELL_EGRESS_INTERFACE: ${SNELL_EGRESS_INTERFACE:-}

    # 宿主机端口:容器端口，容器端口需与配置文件中的 listen 端口一致。
    ports:
      - "${SNELL_PORT:-7177}:${SNELL_PORT:-7177}/tcp"
    # 需要原生 IPv6 / 多 listen 地址时，可改用宿主机网络（并删除上面的 ports）：
    # network_mode: host

    # 最小权限：只保留入口脚本准备文件、降权所需的能力；snell 本身以 PUID 运行，无任何 capability。
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    read_only: true
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---- 可选：ShadowTLS v3，把 snell 流量包装成访问 SHADOW_TLS_SNI 的 HTTPS ----
  # 启用：在 .env 中设置 COMPOSE_PROFILES=shadow-tls 和 SHADOW_TLS_PASSWORD，
  # 路由器只转发 SHADOW_TLS_PORT，不再转发 SNELL_PORT。
  shadow-tls:
    profiles: ["shadow-tls"]
    image: ghcr.io/ihciah/shadow-tls:v0.2.25
    container_name: shadow-tls
    restart: unless-stopped
    depends_on:
      - snell
    # 没设密码时直接退出，避免以空密码运行。
    entrypoint:
      - /bin/sh
      - -c
      - '[ -n "$$PASSWORD" ] || { echo "SHADOW_TLS_PASSWORD is required" >&2; exit 1; }; exec /entrypoint.sh'
    environment:
      MODE: server
      V3: "1"
      STRICT: "1"
      LISTEN: 0.0.0.0:${SHADOW_TLS_PORT:-8443}
      # 转发给同一 compose 网络里的 snell；需与 snell 实际监听端口一致
      SERVER: snell:${SNELL_PORT:-7177}
      # 握手借用的真实网站，必须支持 TLS 1.3，且群晖/服务器能访问到
      TLS: ${SHADOW_TLS_SNI:-www.microsoft.com}:443
      PASSWORD: ${SHADOW_TLS_PASSWORD:-}
    ports:
      - "${SHADOW_TLS_PORT:-8443}:${SHADOW_TLS_PORT:-8443}/tcp"
    user: "65534:65534"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
